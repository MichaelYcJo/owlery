<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws://127.0.0.1:*" />
    <title>Owlery</title>
    <link rel="stylesheet" href="./renderer.css" />
    <style>
      /* The look: the colours, the typefaces, the sizes and the spacing of the sidebar and the four screens are these properties and nothing else. A typeface that is not installed gives way to the next one named. */
      :root {
        --bg: #0f1218;
        --raised: #131720;
        --selected: #1d2330;
        --selected-edge: #3a4254;
        --rule: #272d39;
        --text: #e8eaee;
        --text-second: #c5cad3;
        --text-muted: #9ba4b3;
        --accent: #edb64f;
        --on-accent: #0f1218;
        --waiting: #edb64f;
        --working: #86b6ff;
        --finished: #c5cad3;
        --no-agent: #7b8496;
        --failed: #f0766b;
        --unsealed: #7b8496;
        --terminal-bg: #0b0e13;
        --terminal-text: #d9dde4;
        --backdrop: rgba(0, 0, 0, 0.6);
        --mark: rgba(237, 182, 79, 0.3);
        --font-display: "Space Grotesk", "Inter", system-ui, -apple-system, sans-serif;
        --font-text: "Inter", system-ui, -apple-system, sans-serif;
        --font-mono: "JetBrains Mono", Menlo, monospace;
        /* The terminal's own: after the first family, Nerd Fonts for the icons of common shell prompts, then Korean fallbacks. */
        --font-terminal: "JetBrains Mono", "MesloLGS NF", "MesloLGS Nerd Font", "JetBrainsMono Nerd Font", "Hack Nerd Font", "Symbols Nerd Font Mono", Menlo, "D2Coding", "Apple SD Gothic Neo", monospace;
        --size-label: 12px;
        --size-text: 13px;
        --size-control: 14px;
        --size-line: 15px;
        --size-name: 18px;
        --size-view-title: 24px;
        --size-preview-title: 28px;
        --size-sentence: 30px;
        --size-summary: 60px;
        --size-terminal: 13px;
        --tracking-label: 0.06em;
        --tracking-title: -0.01em;
        --space-1: 2px;
        --space-2: 4px;
        --space-3: 6px;
        --space-4: 8px;
        --space-5: 12px;
        --space-6: 16px;
        --space-7: 20px;
        --space-8: 24px;
        --space-9: 28px;
        --space-10: 44px;
        --space-11: 56px;
        --radius: 8px;
        --radius-small: 6px;
        --radius-card: 10px;
        --titlebar-height: 40px;
        --sidebar-width: 256px;
        --sidebar-line: 28px;
        --icon-button: 24px;
        --icon: 16px;
        --control-height: 44px;
        --field-height: 36px;
        --line-height: 68px;
        --summary-line-height: 72px;
        --change-width: 400px;
        --list-width: 620px;
        --facts-width: 328px;
        --dialog-width: 460px;
        --tab-width: 240px;
        --dot: 10px;
        --dot-small: 8px;
        --seal-size: 30px;
        --seal-size-large: 52px;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: var(--size-text) var(--font-text); }
      body { display: flex; height: 100vh; overflow: hidden; }
      /* A screen that is not in front carries `hidden`, whatever its own display is. */
      [hidden] { display: none !important; }
      button { font: inherit; color: inherit; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      h1, h2, p, ul { margin: 0; padding: 0; }
      ul { list-style: none; }
      .screen { flex: 1; min-width: 0; min-height: 0; }
      .primary { height: var(--control-height); padding: 0 18px; border: 0; border-radius: var(--radius); background: var(--accent); color: var(--on-accent); font-size: var(--size-control); font-weight: 600; }
      .quiet { display: flex; align-items: center; gap: var(--space-4); height: var(--control-height); padding: 0 var(--space-6); border: 0; border-radius: var(--radius); background: none; box-shadow: inset 0 0 0 1px var(--selected-edge); font-size: var(--size-control); font-weight: 600; }
      .caption { font-size: var(--size-label); font-weight: 600; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--text-muted); }
      .hint { font-size: var(--size-label); color: var(--text-muted); }
      /* A title is in the plain ink, and in the strong ink at the heavier weight where its work item changed since the person last looked. */
      .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-second); font-weight: 500; }
      .title.changed { color: var(--text); font-weight: 600; }
      /* The letters of a title or a branch that match what is typed in the search field. */
      mark { border-radius: var(--space-1); background: var(--mark); color: inherit; }
      .count { flex: none; font-size: var(--size-label); color: var(--text-muted); }
      .icon-button { position: relative; flex: none; display: flex; align-items: center; justify-content: center; gap: var(--space-1); box-sizing: border-box; min-width: var(--icon-button); height: var(--icon-button); padding: 0 var(--space-2); border: 0; border-radius: var(--radius-small); background: none; color: var(--text-muted); font-size: var(--size-line); }
      .icon-button:hover, .icon-button.on { color: var(--text); }
      .icon-button svg { width: var(--icon); height: var(--icon); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      /* The sidebar's filter is its icon, with the choices laid over it unseen, so a press on the icon opens them. */
      .icon-button select { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; opacity: 0; cursor: pointer; }
      /* A fixed-width typeface draws a branch, a commit and the terminal, and nothing else. */
      .branch { font-family: var(--font-mono); font-size: var(--size-text); color: var(--text-muted); overflow-wrap: anywhere; }
      /* A state's colour, which its dot, its heading and its words take. */
      .state.waiting { --state: var(--waiting); }
      .state.working { --state: var(--working); }
      .state.finished { --state: var(--finished); }
      .state.no-agent { --state: var(--no-agent); }
      .state.failed { --state: var(--failed); }
      .state { color: var(--state, inherit); }
      .dot { flex: none; box-sizing: border-box; width: var(--dot); height: var(--dot); border-radius: 50%; background: var(--state); }
      /* The dot of a line whose work item did not change since the person last looked: a ring. */
      .dot.unchanged { border: 2px solid var(--text-muted); background: none; }
      /* The seal's place of a work item with no seal: a ring the style draws, with no image in it. */
      .seal.unsealed { flex: none; display: block; box-sizing: border-box; width: var(--seal-size); height: var(--seal-size); border-radius: 50%; border: 1.5px dashed var(--unsealed); }
      .seal.large { width: var(--seal-size-large); height: var(--seal-size-large); }

      #sidebar { flex: none; display: flex; flex-direction: column; box-sizing: border-box; width: var(--sidebar-width); min-height: 0; border-right: 1px solid var(--rule); background: var(--raised); }
      /* As high as the hidden title bar: it holds the window's traffic lights on macOS, drags the window and holds nothing else. */
      #sidebar-top { flex: none; height: var(--titlebar-height); -webkit-app-region: drag; }
      #search { position: relative; flex: none; display: flex; align-items: center; margin: 0 var(--space-5) var(--space-5); }
      #search-field { flex: 1; min-width: 0; height: var(--sidebar-line); padding-right: 84px; border-radius: var(--radius-small); }
      #search-aside { position: absolute; right: var(--space-4); display: flex; gap: var(--space-3); pointer-events: none; }
      #sidebar-nav { flex: none; display: flex; flex-direction: column; gap: var(--space-1); padding: 0 var(--space-4); }
      .side-item { display: flex; align-items: center; gap: var(--space-4); box-sizing: border-box; width: 100%; height: var(--sidebar-line); padding: 0 var(--space-4); border: 0; border-radius: var(--radius-small); background: none; color: var(--text-second); text-align: left; }
      .side-item[aria-current] { background: var(--selected); box-shadow: inset 0 0 0 1px var(--selected-edge); color: var(--text); }
      .side-item .word, .side-item .title { flex: 1; }
      .side-item .word { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .side-item .dot { width: var(--dot-small); height: var(--dot-small); }
      #repositories-head { flex: none; display: flex; align-items: center; gap: var(--space-1); margin-top: var(--space-5); padding: var(--space-5) var(--space-4) var(--space-3) var(--space-5); border-top: 1px solid var(--rule); }
      #repositories-head h2 { flex: 1; }
      #repositories { flex: 1; display: flex; flex-direction: column; gap: var(--space-3); min-height: 0; overflow: auto; padding: 0 var(--space-4) var(--space-4); }
      .repository ul { display: flex; flex-direction: column; gap: var(--space-1); }
      .repository .fold { color: var(--text-muted); }
      .repository .fold .chevron { flex: none; width: var(--space-5); }
      .repository li .side-item { padding-left: var(--space-7); }
      #sidebar-foot { flex: none; padding: var(--space-4) var(--space-5); border-top: 1px solid var(--rule); }
      #status { font-size: var(--size-label); color: var(--text-muted); overflow-wrap: anywhere; }
      /* What the window has to tell: that it is reconnecting, or a request the daemon refused. */
      #status.notice { color: var(--waiting); }
      #status:empty::before { content: "\00a0"; }

      #summary-screen { display: flex; flex-direction: column; gap: var(--space-9); box-sizing: border-box; overflow: auto; padding: var(--space-10) var(--space-11); }
      #summary-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-10); }
      #summary-sentence { font-family: var(--font-display); font-size: var(--size-summary); font-weight: 600; line-height: 64px; letter-spacing: var(--tracking-title); }
      #summary-last-here { flex: none; margin-bottom: var(--space-2); font-size: var(--size-text); }
      #summary-lines { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
      #summary-lines button { display: grid; grid-template-columns: minmax(0, 1fr) var(--change-width) auto; column-gap: var(--space-7); align-items: center; box-sizing: border-box; width: 100%; height: var(--summary-line-height); padding: 0 var(--space-4); border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; }
      #summary-lines .text { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
      #summary-lines .title { font-size: var(--size-line); color: var(--text); font-weight: 600; }
      #summary-lines .branch { font-size: var(--size-label); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #summary-lines .change { font-size: var(--size-control); line-height: 20px; }
      #summary-foot { display: flex; align-items: center; gap: var(--space-6); }

      /* The inbox screen and the history screen: a list of lines and the preview of the selected one. */
      .list-screen { display: grid; grid-template-columns: var(--list-width) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
      .list { display: flex; flex-direction: column; gap: var(--space-7); box-sizing: border-box; min-height: 0; overflow: auto; padding: var(--space-9) var(--space-6) var(--space-7) var(--space-8); border-right: 1px solid var(--rule); }
      .list-head { display: flex; flex-direction: column; gap: var(--space-4); padding: 0 var(--space-4); }
      .list-head .row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); }
      .list-head select { height: var(--sidebar-line); font-size: var(--size-label); border-radius: var(--radius-small); }
      .list-sentence { font-family: var(--font-display); font-size: var(--size-sentence); font-weight: 600; line-height: 36px; letter-spacing: var(--tracking-title); }
      .lines { display: flex; flex-direction: column; gap: var(--space-1); }
      .lines h2 { padding: 18px var(--space-4) var(--space-3); }
      .lines h2:first-child { padding-top: var(--space-3); }
      .lines ul { display: flex; flex-direction: column; gap: var(--space-1); }
      .line { display: grid; grid-template-columns: var(--space-5) minmax(0, 1fr) auto; column-gap: var(--space-5); align-items: center; box-sizing: border-box; width: 100%; height: var(--line-height); padding: 0 var(--space-5) 0 var(--space-4); border: 0; border-radius: var(--radius); background: none; text-align: left; }
      .line.selected { background: var(--selected); box-shadow: inset 0 0 0 1px var(--selected-edge); }
      .line .text { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
      .line .title { font-size: var(--size-line); }
      .line .meta { font-family: var(--font-mono); font-size: var(--size-label); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .line .branch { font-size: inherit; }
      .line .commits:not(:empty)::before { content: " · "; }
      .list-empty { padding: 0 var(--space-4); color: var(--text-muted); }
      .list-last-here, .list-match { font-size: var(--size-text); }
      .list-legend { margin-top: auto; padding: 0 var(--space-4); }
      .preview { box-sizing: border-box; min-width: 0; min-height: 0; overflow: auto; padding: var(--space-10) var(--space-11); background: var(--raised); }
      .preview-content { display: flex; flex-direction: column; gap: var(--space-9); min-height: 100%; }
      .preview-heading { display: flex; flex-direction: column; gap: var(--space-5); }
      .preview-title { font-family: var(--font-display); font-size: var(--size-preview-title); font-weight: 600; line-height: 36px; letter-spacing: var(--tracking-title); overflow-wrap: anywhere; }
      .preview-facts { display: flex; align-items: center; gap: var(--space-5); }
      .preview-foot { margin-top: auto; display: flex; align-items: center; gap: var(--space-6); }

      #work-item-view { display: grid; grid-template-columns: minmax(0, 1fr) var(--facts-width); grid-template-rows: minmax(0, 1fr); }
      #view-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      #view-header { flex: none; display: flex; flex-direction: column; gap: var(--space-4); padding: 22px var(--space-9) 18px; }
      #view-title { font-family: var(--font-display); font-size: var(--size-view-title); font-weight: 600; line-height: 30px; letter-spacing: var(--tracking-title); overflow-wrap: anywhere; }
      #pane-area { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      #pane-bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); padding: 0 var(--space-9); border-bottom: 1px solid var(--rule); }
      #tabs { display: flex; gap: var(--space-2); min-width: 0; overflow-x: auto; }
      #pane-buttons { flex: none; display: flex; gap: var(--space-5); }
      #pane-bar button { height: var(--control-height); border: 0; background: none; color: var(--text-muted); font-weight: 500; }
      #pane-buttons button { padding: 0 var(--space-2); }
      #tabs .tab { flex: none; display: flex; border-bottom: 2px solid transparent; }
      #tabs .tab.active { border-bottom-color: var(--accent); }
      #tabs .tab .label { max-width: var(--tab-width); padding: 0 var(--space-2) 0 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #tabs .tab.active .label { color: var(--text); font-weight: 600; }
      #tabs .tab .close { padding: 0 var(--space-4) 0 var(--space-2); }
      #pane-bar button:hover { color: var(--text); }
      #no-panes { padding: var(--space-7) var(--space-9); color: var(--text-muted); }
      #stage { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; background: var(--terminal-bg); }
      .pane { position: absolute; inset: var(--space-7) var(--space-9); }
      #view-facts { display: flex; flex-direction: column; gap: 26px; box-sizing: border-box; min-height: 0; padding: 22px var(--space-8); border-left: 1px solid var(--rule); background: var(--raised); }
      #view-seal { display: flex; align-items: center; gap: 14px; }
      #view-seal .words { display: flex; flex-direction: column; gap: 3px; }
      #view-seal .name { font-size: var(--size-line); font-weight: 600; }
      #view-seal .note { font-size: var(--size-label); line-height: 17px; color: var(--text-muted); }

      #ask { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-4); min-height: 0; }
      #ask-form { flex: none; display: flex; gap: var(--space-3); }
      #ask-form input { flex: 1; min-width: 0; }
      #ask-form button { height: var(--field-height); padding: 0 14px; }
      #headless { min-height: 0; overflow: auto; }
      #headless li { padding: var(--space-4) 0; border-bottom: 1px solid var(--rule); }
      #headless li:last-child { border-bottom: 0; }
      #headless .row { display: flex; gap: var(--space-3); align-items: baseline; }
      #headless .prompt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      #headless .state { font-size: var(--size-label); }
      #headless .answer { display: block; margin-top: var(--space-2); color: var(--text-second); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
      #headless:empty::after { content: "Nothing asked yet"; font-size: var(--size-label); color: var(--text-muted); }

      input, select { box-sizing: border-box; height: var(--field-height); padding: 0 var(--space-5); border: 1px solid var(--selected-edge); border-radius: var(--radius); background: var(--bg); color: var(--text); font: inherit; }

      #work-item-dialog { box-sizing: border-box; width: var(--dialog-width); padding: var(--space-8); border: 1px solid var(--selected-edge); border-radius: var(--radius-card); background: var(--raised); color: inherit; }
      #work-item-dialog::backdrop { background: var(--backdrop); }
      #work-item-dialog h2 { margin-bottom: var(--space-6); font-family: var(--font-display); font-size: var(--size-name); font-weight: 600; }
      #work-item-dialog label { display: block; margin-bottom: var(--space-5); color: var(--text-muted); }
      #work-item-dialog .row { display: flex; gap: var(--space-3); margin-top: var(--space-3); }
      #work-item-dialog .row.end { justify-content: flex-end; gap: var(--space-4); margin-top: 0; }
      #work-item-dialog input, #work-item-dialog select { flex: 1; min-width: 0; }
      #work-item-dialog .quiet, #work-item-dialog .primary { height: var(--field-height); padding: 0 var(--space-6); font-size: var(--size-text); }
      #work-item-error { min-height: 1.3em; margin-bottom: var(--space-4); color: var(--failed); overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <!-- The sidebar stands at the left of every screen, and is displayed before the daemon's `ready` arrives. -->
    <nav id="sidebar" aria-label="Owlery">
      <div id="sidebar-top"></div>
      <div id="search">
        <input id="search-field" autocomplete="off" spellcheck="false" placeholder="Search" aria-label="Search the work items by title, branch or repository" />
        <span id="search-aside" class="hint">
          <span id="search-count"></span>
          <span id="search-key"></span>
        </span>
      </div>
      <ul id="sidebar-nav">
        <li>
          <button id="nav-inbox" class="side-item"><span class="word">Inbox</span><span id="nav-inbox-count" class="count"></span></button>
        </li>
        <li>
          <button id="nav-summary" class="side-item"><span class="word">Summary</span><span id="nav-summary-count" class="count"></span></button>
        </li>
        <li>
          <button id="nav-history" class="side-item"><span class="word">History</span></button>
        </li>
      </ul>
      <div id="repositories-head">
        <h2 class="caption">Repositories</h2>
        <button id="bell" class="icon-button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1.5H3L4 11Z" /><path d="M6.5 14.5h3" /></svg>
          <span id="bell-count" class="count"></span>
        </button>
        <label id="sidebar-filter-control" class="icon-button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M4.5 8h7M6.5 12h3" /></svg>
          <select id="sidebar-filter" class="filter" aria-label="Show the work items of one state"></select>
        </label>
        <button id="add-repository" class="icon-button" title="Add a repository" aria-label="Add a repository">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 12.5v-9h4l1.5 2h7.5v7h-13Z" /><path d="M8 7.5v3M6.5 9h3" /></svg>
        </button>
        <button id="new-work-item" class="icon-button" title="New work item" aria-label="New work item">+</button>
      </div>
      <div id="repositories"></div>
      <div id="sidebar-foot">
        <p id="status" role="status"></p>
      </div>
    </nav>
    <!-- No screen is in front until the daemon's `ready` says which one opens. -->
    <main id="summary-screen" class="screen" hidden>
      <div id="summary-head">
        <h1 id="summary-sentence"></h1>
        <p id="summary-last-here" class="hint"></p>
      </div>
      <ul id="summary-lines"></ul>
      <div id="summary-foot">
        <button id="summary-main" class="primary"></button>
        <button id="summary-second" class="quiet" hidden></button>
        <span id="summary-hint" class="hint"></span>
      </div>
    </main>
    <!-- The inbox screen and the history screen are each a copy of the list screen below, whose parts take the screen's name before their own as their ids. -->
    <main id="inbox-screen" class="screen list-screen" hidden></main>
    <main id="history-screen" class="screen list-screen" hidden></main>
    <template id="list-screen">
      <section data-part="list" class="list">
        <div data-part="head" class="list-head">
          <div class="row">
            <span data-part="word" class="caption"></span>
            <select data-part="filter" class="filter" aria-label="Show the work items of one state"></select>
          </div>
          <h1 data-part="summary" class="list-sentence" hidden></h1>
          <p data-part="last-here" class="hint list-last-here" hidden></p>
          <p data-part="match" class="hint list-match" hidden></p>
        </div>
        <div data-part="lines" class="lines"></div>
        <p data-part="empty" class="list-empty" hidden></p>
        <p data-part="legend" class="hint list-legend" hidden>A filled dot marks what changed since you were last here.</p>
      </section>
      <section data-part="preview" class="preview" aria-label="The selected work item">
        <div data-part="preview-content" class="preview-content" hidden>
          <div class="preview-heading">
            <span data-part="preview-state" class="caption state"></span>
            <h2 data-part="preview-title" class="preview-title"></h2>
            <span data-part="preview-branch" class="branch"></span>
          </div>
          <div class="preview-facts">
            <span data-part="preview-seal"></span>
            <span data-part="preview-commits" class="caption"></span>
          </div>
          <div class="preview-foot">
            <button data-part="open-work-item" class="quiet">Open the work item <span aria-hidden="true">›</span></button>
            <span class="hint">Enter opens it. J and K move through the inbox.</span>
          </div>
        </div>
      </section>
    </template>
    <main id="work-item-view" class="screen" hidden>
      <div id="view-main">
        <header id="view-header">
          <span id="view-state" class="caption state"></span>
          <h1 id="view-title"></h1>
          <span id="view-branch" class="branch"></span>
        </header>
        <section id="pane-area" aria-label="Panes">
          <div id="pane-bar">
            <div id="tabs"></div>
            <div id="pane-buttons"></div>
          </div>
          <p id="no-panes" hidden>No pane is open in this work item.</p>
          <div id="stage"></div>
        </section>
      </div>
      <aside id="view-facts">
        <section id="view-seal">
          <span id="view-seal-place"></span>
          <span class="words">
            <span class="name">No seal yet</span>
            <span class="note">A seal binds to one commit and breaks if another lands after it.</span>
          </span>
        </section>
        <h2 id="view-commits" class="caption" hidden></h2>
        <section id="ask">
          <h2 class="caption">Ask</h2>
          <form id="ask-form">
            <input id="ask-prompt" autocomplete="off" aria-label="What to ask in this work item" />
            <button type="submit" id="ask-submit" class="quiet">Ask</button>
          </form>
          <ul id="headless"></ul>
        </section>
      </aside>
    </main>
    <dialog id="work-item-dialog">
      <form id="work-item-form">
        <h2>New work item</h2>
        <label>
          Repository folder
          <span class="row">
            <input id="work-item-repo" spellcheck="false" autocomplete="off" />
            <button type="button" id="work-item-browse" class="quiet">Browse…</button>
          </span>
        </label>
        <label>
          Title
          <span class="row"><input id="work-item-title" autocomplete="off" /></span>
        </label>
        <label>
          Open
          <span class="row">
            <select id="work-item-kind"></select>
          </span>
        </label>
        <p id="work-item-error" role="alert"></p>
        <div class="row end">
          <button type="button" id="work-item-cancel" class="quiet">Cancel</button>
          <button type="submit" id="work-item-create" class="primary">Create</button>
        </div>
      </form>
    </dialog>
    <script src="./renderer.js"></script>
  </body>
</html>
