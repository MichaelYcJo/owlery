<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws://127.0.0.1:*" />
    <title>Owlery</title>
    <link rel="stylesheet" href="./renderer.css" />
    <style>
      /* The look: the colours, the typefaces and the spacing of both screens are these properties and nothing else. */
      :root {
        --bg: #1e1e1e;
        --surface: #252526;
        --control: #333;
        --hover: #2a2d2e;
        --border: #444;
        --divider: #333;
        --rule: #2a2a2a;
        --text: #d4d4d4;
        --text-strong: #fff;
        --text-soft: #aaa;
        --text-muted: #888;
        --text-faint: #666;
        --accent: #0e639c;
        --working: #75beff;
        --waiting: #e2c08d;
        --finished: #89d185;
        --failed: #f48771;
        --backdrop: rgba(0, 0, 0, 0.5);
        --font: -apple-system, sans-serif;
        --font-size: 12px;
        --font-size-small: 11px;
        --font-size-title: 13px;
        --space-1: 2px;
        --space-2: 4px;
        --space-3: 6px;
        --space-4: 8px;
        --space-5: 12px;
        --space-6: 16px;
        --radius: 4px;
        --radius-dialog: 6px;
        --ask-width: 260px;
        --dialog-width: 420px;
        --tab-width: 240px;
        --seal-size: 20px;
        --seal-unsealed-opacity: 0.35;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: var(--font-size) var(--font); }
      body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
      /* A screen that is not in front carries `hidden`, whatever its own display is. */
      [hidden] { display: none !important; }
      button { font: inherit; }
      .screen { flex: 1; min-height: 0; }
      .screen > header { display: flex; gap: var(--space-4); align-items: center; padding: var(--space-3) var(--space-4); background: var(--surface); }
      .screen > header button, #pane-bar button { background: var(--control); color: inherit; border: 1px solid var(--border); border-radius: var(--radius); padding: 3px var(--space-4); cursor: pointer; }
      .state.working { color: var(--working); }
      .state.waiting { color: var(--waiting); }
      .state.finished { color: var(--finished); }
      .state.failed { color: var(--failed); }
      .branch, .commits { color: var(--text-muted); font-size: var(--font-size-small); }
      .seal { width: var(--seal-size); height: var(--seal-size); flex: none; }
      .seal.unsealed { opacity: var(--seal-unsealed-opacity); filter: grayscale(1); }

      #inbox-screen { display: flex; flex-direction: column; }
      #inbox-screen h1 { font-size: var(--font-size-title); margin: 0; }
      #inbox-summary { flex: 1; color: var(--text-soft); }
      #inbox-lines { flex: 1; min-height: 0; overflow: auto; }
      #inbox { list-style: none; margin: 0; padding: 0; }
      #inbox li { border-bottom: 1px solid var(--rule); }
      #inbox button { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr) 6em 9em auto; gap: var(--space-5); align-items: center; width: 100%; padding: var(--space-4) var(--space-5); background: none; color: inherit; border: 0; text-align: left; cursor: pointer; }
      #inbox button:hover { background: var(--hover); }
      #inbox .title, #inbox .branch { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #inbox .title { font-size: var(--font-size-title); }
      #inbox-empty { margin: 0; padding: var(--space-5); color: var(--text-faint); }

      #work-item-view { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) var(--ask-width); }
      #work-item-view > header { grid-column: 1 / 3; }
      #view-title { font-size: var(--font-size-title); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #view-commits { flex: 1; }
      #pane-area { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      #pane-bar { display: flex; gap: var(--space-2); align-items: center; padding: var(--space-3) var(--space-4); }
      #tabs, #pane-buttons { display: flex; gap: var(--space-2); min-width: 0; }
      #tabs .tab { display: flex; min-width: 0; }
      #tabs .tab .label { max-width: var(--tab-width); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: var(--radius) 0 0 var(--radius); }
      #tabs .tab .close { border-left: 0; border-radius: 0 var(--radius) var(--radius) 0; padding: 3px var(--space-3); color: var(--text-muted); }
      #tabs .tab .close:hover { color: var(--text-strong); }
      #tabs .tab.active button { background: var(--accent); border-color: var(--accent); }
      #no-panes { margin: 0; padding: var(--space-3) var(--space-4); color: var(--text-faint); }
      #stage { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; }
      .pane { position: absolute; inset: var(--space-4); }

      #ask { border-left: 1px solid var(--divider); overflow: auto; padding: var(--space-3) var(--space-4); min-height: 0; }
      #ask h2 { font-size: var(--font-size-small); text-transform: uppercase; color: var(--text-muted); margin: var(--space-2) 0 var(--space-3); }
      #ask-form { display: flex; gap: var(--space-3); margin: 0 0 var(--space-3); }
      #ask-form input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-2) var(--space-3); font: inherit; }
      #ask-form button { background: var(--accent); color: inherit; border: 1px solid var(--accent); border-radius: var(--radius); padding: 3px 10px; cursor: pointer; }
      #ask-form button:disabled { opacity: 0.5; cursor: default; }
      #headless { list-style: none; margin: 0 0 var(--space-5); padding: 0; }
      #headless li { padding: var(--space-2) var(--space-1); border-bottom: 1px solid var(--rule); }
      #headless .row { display: flex; gap: var(--space-3); align-items: baseline; }
      #headless .prompt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      #headless .answer { display: block; margin-top: var(--space-1); color: var(--text-soft); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
      #headless:empty::after { content: "Nothing asked yet"; color: var(--text-faint); }

      #status { margin: 0; padding: var(--space-2) var(--space-4); background: var(--surface); color: var(--waiting); overflow-wrap: anywhere; }
      #status:empty { display: none; }

      #work-item-dialog { background: var(--surface); color: inherit; border: 1px solid var(--border); border-radius: var(--radius-dialog); padding: 14px var(--space-6); width: var(--dialog-width); }
      #work-item-dialog::backdrop { background: var(--backdrop); }
      #work-item-dialog h2 { font-size: var(--font-size-title); margin: 0 0 10px; }
      #work-item-dialog label { display: block; margin-bottom: 10px; color: var(--text-soft); }
      #work-item-dialog .row { display: flex; gap: var(--space-3); margin-top: var(--space-2); }
      #work-item-dialog .row.end { justify-content: flex-end; }
      #work-item-dialog input, #work-item-dialog select { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-2) var(--space-3); font: inherit; }
      #work-item-dialog button { background: var(--control); color: inherit; border: 1px solid var(--border); border-radius: var(--radius); padding: 3px 10px; cursor: pointer; }
      #work-item-dialog button[type="submit"] { background: var(--accent); border-color: var(--accent); }
      #work-item-dialog button:disabled { opacity: 0.5; cursor: default; }
      #work-item-error { color: var(--failed); min-height: 1.3em; margin: 0 0 var(--space-4); overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main id="inbox-screen" class="screen">
      <header>
        <h1>Inbox</h1>
        <span id="inbox-summary"></span>
        <button id="new-work-item">+ Work item</button>
      </header>
      <div id="inbox-lines">
        <ul id="inbox"></ul>
        <p id="inbox-empty" hidden>No work items yet.</p>
      </div>
    </main>
    <main id="work-item-view" class="screen" hidden>
      <header id="view-header">
        <button id="back-to-inbox">← Inbox</button>
        <span id="view-title"></span>
        <span id="view-branch" class="branch"></span>
        <span id="view-state" class="state"></span>
        <span id="view-commits" class="commits"></span>
      </header>
      <section id="pane-area" aria-label="Panes">
        <div id="pane-bar">
          <div id="tabs"></div>
          <div id="pane-buttons"></div>
        </div>
        <p id="no-panes" hidden>No pane is open in this work item.</p>
        <div id="stage"></div>
      </section>
      <aside id="ask">
        <h2>Ask</h2>
        <form id="ask-form">
          <input id="ask-prompt" autocomplete="off" aria-label="What to ask in this work item" />
          <button type="submit" id="ask-submit">Ask</button>
        </form>
        <ul id="headless"></ul>
      </aside>
    </main>
    <p id="status" role="status"></p>
    <dialog id="work-item-dialog">
      <form id="work-item-form">
        <h2>New work item</h2>
        <label>
          Repository folder
          <span class="row">
            <input id="work-item-repo" spellcheck="false" autocomplete="off" />
            <button type="button" id="work-item-browse">Browse…</button>
          </span>
        </label>
        <label>
          Title
          <span class="row"><input id="work-item-title" autocomplete="off" /></span>
        </label>
        <label>
          Open
          <span class="row">
            <select id="work-item-kind"></select>
          </span>
        </label>
        <p id="work-item-error" role="alert"></p>
        <div class="row end">
          <button type="button" id="work-item-cancel">Cancel</button>
          <button type="submit" id="work-item-create">Create</button>
        </div>
      </form>
    </dialog>
    <script src="./renderer.js"></script>
  </body>
</html>
