# The pull request check of Owlery: a pull request that declares a work item
# carries the records it owes, and a ready one carries a cleared inspection
# at its head. A pull request that declares no work item is not judged.
# The check posts its verdict as the check `inspection` on the pull request's
# head commit, which an administrator can make required.
# This file fetches the check from Owlery's repository at one release, the
# one named below. That line moves when the file is written again.

name: inspection

on:
  pull_request:
    # A draft made ready and a body edited make no commit, so each is named.
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the check reads the commits since the base branch

      # The release's tag, or the release's branch until the tag exists.
      - name: the check, at Owlery 0.2.0
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch v0.2.0 \
            https://github.com/MichaelYcJo/owlery.git "$RUNNER_TEMP/owlery" \
          || git clone --quiet --depth 1 --branch release/v0.2.0 \
            https://github.com/MichaelYcJo/owlery.git "$RUNNER_TEMP/owlery"

      - name: a declared work item carries the records it owes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 "$RUNNER_TEMP/owlery/pr-check/skills/code-review/scripts/chain_check.py" \
            --baseline "origin/${{ github.base_ref }}" \
            --post
