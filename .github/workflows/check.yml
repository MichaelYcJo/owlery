# Runs the workspace's checks on every pull request into `main` and into a
# release branch, so a pull request whose suite fails shows red. The desktop
# app's checks are its typecheck and its tests, and the tests start the built
# Electron app and load node-pty rebuilt for Electron's ABI, so they run on
# macOS, the one platform the app is built for.

name: check

on:
  pull_request:
    branches: [main, "release/**"]

# A newer push cancels the run still in progress for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The desktop app's postinstall rebuilds node-pty for Electron.
      - name: install
        run: pnpm install --frozen-lockfile

      - name: diagnostic (temporary)
        continue-on-error: true
        working-directory: apps/desktop
        run: |
          time sh -c 'i=0; while [ $i -lt 40 ]; do echo line-$i; i=$((i+1)); sleep 0.02; done' > /dev/null
          for n in 1 2 3 4; do NO_COLOR=1 FORCE_COLOR=0 node scripts/test-in-electron.mjs test/work-item-menu.test.ts > "$RUNNER_TEMP/out-$n.txt" 2>&1 && rc=0 || rc=$?; echo "run $n exit $rc"; grep -E "Tests " "$RUNNER_TEMP/out-$n.txt" || true; [ "$rc" = 0 ] || sed -n '/Failed Tests/,/Test Files/p' "$RUNNER_TEMP/out-$n.txt" | cut -c1-8000; done

      - name: pnpm -r run check
        run: pnpm -r run check
